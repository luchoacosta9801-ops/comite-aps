<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" font-family="Segoe UI, Arial, sans-serif">
  <title>Portada de informes de niveles freáticos: corte del suelo con caña, pozo de observación y nivel freático</title>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb3ea"/><stop offset="1" stop-color="#d6eefa"/></linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c5c36"/><stop offset=".5" stop-color="#78502f"/><stop offset="1" stop-color="#5a3a21"/></linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b86c8" stop-opacity=".8"/><stop offset="1" stop-color="#173f6e" stop-opacity=".95"/></linearGradient>
    <linearGradient id="tubo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9d1d9"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#a3aebb"/></linearGradient>
    <pattern id="granos" width="28" height="24" patternUnits="userSpaceOnUse"><circle cx="5" cy="7" r="1.7" fill="#b07d50" opacity=".5"/><circle cx="18" cy="16" r="1.3" fill="#40281a" opacity=".45"/><circle cx="24" cy="4" r="1" fill="#c99464" opacity=".4"/></pattern>
    <pattern id="gotas" width="32" height="28" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="2.2" fill="#cbe9ff" opacity=".35"/><circle cx="23" cy="20" r="1.6" fill="#cbe9ff" opacity=".3"/></pattern>
    <g id="cana">
      <g stroke="#3f8f2f" stroke-width="8" stroke-linecap="round"><path d="M0 0 V -150"/><path d="M16 0 V -128"/><path d="M-16 0 V -120"/></g>
      <g stroke="#2c7022" stroke-width="1.6"><path d="M-4 -30 h8 M-4 -70 h8 M-4 -110 h8 M12 -36 h8 M12 -80 h8 M-20 -40 h8 M-20 -84 h8"/></g>
      <g fill="none" stroke="#5fb544" stroke-width="5" stroke-linecap="round"><path d="M0 -140 q -50 -14 -78 22"/><path d="M0 -128 q 46 -22 80 8"/><path d="M16 -116 q 42 -12 62 26"/><path d="M-16 -108 q -38 0 -56 34"/><path d="M0 -150 q 8 -30 -12 -38"/></g>
      <g fill="none" stroke="#ecd9b0" stroke-width="2.4" stroke-linecap="round" opacity=".95">
        <path d="M0 0 q -10 50 -32 100"/><path d="M0 0 q 8 58 2 120"/><path d="M0 0 q 22 44 44 86"/><path d="M-12 0 q -32 30 -58 48"/><path d="M12 0 q 34 30 60 40"/>
        <path d="M-32 100 q -8 14 -18 22"/><path d="M2 120 q -4 12 2 20"/><path d="M44 86 q 10 10 8 22"/>
      </g>
    </g>
  </defs>

  <!-- Cielo -->
  <rect width="816" height="460" fill="url(#cielo)"/>
  <circle cx="700" cy="110" r="44" fill="#ffd54a"/><circle cx="700" cy="110" r="64" fill="#ffd54a" opacity=".22"/>
  <g fill="#fff" opacity=".85"><ellipse cx="560" cy="210" rx="70" ry="17"/><ellipse cx="600" cy="198" rx="44" ry="18"/><ellipse cx="300" cy="80" rx="60" ry="14"/></g>
  <!-- Cordillera al fondo -->
  <path d="M0 430 L 120 360 L 210 400 L 330 330 L 450 395 L 560 345 L 690 405 L 816 350 L 816 460 L 0 460 Z" fill="#6c8fa8" opacity=".45"/>

  <!-- Suelo -->
  <path d="M0 455 Q 200 446 408 455 T 816 455 V 1056 H 0 Z" fill="url(#suelo)"/>
  <rect x="0" y="455" width="816" height="601" fill="url(#granos)"/>
  <!-- Franja de cultivo en superficie -->
  <path d="M0 455 Q 200 446 408 455 T 816 455" fill="none" stroke="#4e8a2e" stroke-width="6"/>

  <!-- Zona saturada (agua subterránea) -->
  <path d="M0 735 C 140 716, 260 752, 400 728 S 650 708, 816 736 L 816 1056 L 0 1056 Z" fill="url(#agua)"/>
  <path d="M0 735 C 140 716, 260 752, 400 728 S 650 708, 816 736 L 816 1056 L 0 1056 Z" fill="url(#gotas)"/>
  <path d="M0 735 C 140 716, 260 752, 400 728 S 650 708, 816 736" fill="none" stroke="#a9dcff" stroke-width="4" stroke-dasharray="14 8"/>

  <!-- Dren entubado (corte) -->
  <g transform="translate(150,880)">
    <circle r="46" fill="#2a5a8c" stroke="#d8e2ea" stroke-width="10"/>
    <path d="M-30 12 q 15 -8 30 0 t 30 0" fill="none" stroke="#cbe9ff" stroke-width="3"/>
    <circle r="56" fill="none" stroke="#c9a46c" stroke-width="6" stroke-dasharray="6 7"/>
  </g>
  <g fill="none" stroke="#cbe9ff" stroke-width="3" stroke-linecap="round" opacity=".85"><path d="M300 820 q -50 10 -80 40"/><path d="M220 860 l 6 -14 m -6 14 l 14 -4"/></g>

  <!-- Caña con raíces -->
  <use href="#cana" x="60" y="455"/><use href="#cana" x="230" y="455"/><use href="#cana" x="400" y="455"/><use href="#cana" x="760" y="455"/>

  <!-- Pozo de observación con cinta de medida -->
  <g>
    <rect x="566" y="420" width="32" height="520" rx="5" fill="url(#tubo)" stroke="#7f8d9b"/>
    <rect x="561" y="412" width="42" height="14" rx="4" fill="#e30613"/>
    <rect x="571" y="729" width="22" height="209" fill="#3b86c8" opacity=".9"/>
    <g fill="#5d6a77"><circle cx="582" cy="770" r="2.5"/><circle cx="582" cy="800" r="2.5"/><circle cx="582" cy="830" r="2.5"/><circle cx="582" cy="860" r="2.5"/><circle cx="582" cy="890" r="2.5"/><circle cx="582" cy="920" r="2.5"/></g>
    <path d="M581 412 V 330 q 0 -18 18 -18 h 44" fill="none" stroke="#f5c400" stroke-width="6"/>
    <rect x="636" y="292" width="52" height="34" rx="8" fill="#f5c400" stroke="#b38f00" stroke-width="2"/>
    <circle cx="662" cy="309" r="9" fill="#b38f00"/>
    <path d="M580 426 V 727" stroke="#f5c400" stroke-width="4"/>
    <circle cx="580" cy="729" r="6" fill="#f5c400" stroke="#8a6d00" stroke-width="2"/>
  </g>

  <!-- Escala de profundidad (rangos de los informes) -->
  <g transform="translate(690,455)">
    <rect x="0" y="0" width="22" height="80" fill="#e8202a"/>
    <rect x="0" y="80" width="22" height="80" fill="#f7941d"/>
    <rect x="0" y="160" width="22" height="80" fill="#f4e82a"/>
    <rect x="0" y="240" width="22" height="80" fill="#3aaa35"/>
    <rect x="0" y="0" width="22" height="320" fill="none" stroke="#fff" stroke-width="2"/>
    <g font-size="15" fill="#fff" font-weight="700"><text x="30" y="8">0,0 m</text><text x="30" y="85">0,5</text><text x="30" y="165">1,0</text><text x="30" y="245">1,5</text><text x="30" y="324">2,0</text></g>
  </g>
  <path d="M600 729 H 688" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Rótulos -->
  <g font-weight="700">
    <rect x="380" y="770" width="290" height="40" rx="20" fill="rgba(10,25,45,.72)"/>
    <text x="525" y="796" text-anchor="middle" font-size="18" fill="#cbe9ff">Nivel freático</text>
    <rect x="60" y="610" width="230" height="34" rx="17" fill="rgba(10,25,45,.55)"/>
    <text x="175" y="633" text-anchor="middle" font-size="15" fill="#fff">Zona de raíces aireada</text>
    <rect x="70" y="960" width="160" height="32" rx="16" fill="rgba(10,25,45,.6)"/>
    <text x="150" y="982" text-anchor="middle" font-size="14" fill="#fff">Dren de evacuación</text>
    <rect x="610" y="955" width="170" height="32" rx="16" fill="rgba(10,25,45,.6)"/>
    <text x="695" y="977" text-anchor="middle" font-size="14" fill="#fff">Pozo de observación</text>
  </g>
</svg>
